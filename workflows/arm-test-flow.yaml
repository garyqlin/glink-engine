project:
  name: arm-test-flow
  title: 🧪 战甲全链路测试 — 上海书店推荐卡片
  goal: |-
    测试所有战甲的配合度、大模型表现、工具调用能力。
    输出：一份可运行的HTML卡片展示页，含搜索数据+后端处理+前端呈现+审计报告。

global_context: |
  你是一个全栈开发团队，协作构建一个"上海书店推荐卡片"的网页应用。

  ## 技术约束
  - 后端：Python 3，生成纯 JSON 数据文件（store-data.json）
  - 前端：纯 HTML + CSS + JS，单文件，响应式设计，卡片风格
  - 所有文件输出到 projects/arm-test-flow/ 目录

steps:
  # ── Step 1: agent-a搜索 ──
  - id: step-1
    executor: agent-a
    title: 搜索上海值得去的书店数据
    description: |-
      搜索至少5家上海有特色的独立书店或网红书店。
      每本书店需要：名称、地址、简介、特色标签（2-3个）、一句话推荐理由。
      搜索来源包括大众点评、小红书、知乎、马蜂窝等。
      输出：markdown格式的搜索结果简报。
    output_file: projects/arm-test-flow/bookshop-search.md

  # ── Step 2: agent-b后端 ──
  - id: step-2
    executor: agent-b
    fallback_agents: ["default"]
    title: Python后端 — 生成书店JSON数据
    description: |-
      读取 step-1 的搜索简报（projects/arm-test-flow/bookshop-search.md），
      写一个 Python 脚本（generate_data.py），从数据源提取书店信息，
      输出标准 JSON 格式到 projects/arm-test-flow/store-data.json。

      JSON 格式要求：
      ```json
      {
        "bookshops": [
          {
            "id": 1,
            "name": "书店名称",
            "address": "详细地址",
            "introduction": "100字以内的简介",
            "tags": ["文艺", "独立出版"],
            "recommendation": "一句话推荐理由"
          }
        ]
      }
      ```

      脚本要求：
      - 数据硬编码在脚本中（不依赖网络API）
      - 至少6家书店，数据真实可信
      - 脚本可独立运行：python3 generate_data.py
      - 输出文件写入 projects/arm-test-flow/store-data.json
      - 同时验证JSON格式正确（使用 json.tool 校验）
    input_file: projects/arm-test-flow/bookshop-search.md
    output_file: projects/arm-test-flow/store-data.json
    depends_on: [step-1]

  # ── Step 3: agent-b前端（调用 agent-d 设计） ──
  - id: step-3
    executor: agent-b
    fallback_agents: ["default"]
    title: 前端HTML卡片页面（含CSS动画和交互）
    description: |-
      读取 step-2 生成的 store-data.json，
      创建一个单 HTML 文件（bookshop-cards.html），包含：

      1. **布局**：
         - 顶部标题区 + 筛选标签栏（按tags筛选）
         - 卡片网格（2列响应式，移动端1列）
         - 每家书店一张卡片，含：名称、地址、标签徽章、简介、推荐语
      
      2. **CSS要求**：
         - 暖色调/文艺风格（书店氛围）
         - 卡片悬停有优雅的 elevation 动画
         - 每个标签不同颜色
         - 响应式（桌面2列/平板2列/手机1列）
         - 至少一种CSS动画（淡入、上滑等）
      
      3. **JS要求**：
         - 从内联 JSON 加载数据（JSON 硬编码在 JS 中）
         - 标签筛选功能（点击标签过滤对应卡片）
         - 所有卡片全部展示时显示"共 X 家书店"统计
      
      4. **输出**：
         - 单文件 projects/arm-test-flow/bookshop-cards.html
         - 双击即可在浏览器中打开
    input_file: projects/arm-test-flow/store-data.json
    output_file: projects/arm-test-flow/bookshop-cards.html
    depends_on: [step-2]

  # ── Step 4: Laser 审计 ──
  - id: step-4
    executor: Laser
    fallback_agents: ["default"]
    type: review
    title: 代码审计+功能验证
    description: |-
      审计 step-2 和 step-3 产出的所有文件：

      **后端审计**：
      1. generate_data.py — 语法检查、JSON格式校验
      2. store-data.json — 数据完整性验证（ID无重复、必填字段齐全）
      3. 运行 python3 generate_data.py 确认可复现

      **前端审计**：
      1. bookshop-cards.html — HTML标签闭合检查
      2. CSS语法检查
      3. JS语法检查
      4. 响应式设计验证
      5. 交互功能验证（标签筛选逻辑是否完整）
      6. 检查是否有浏览器兼容性问题

      **输出**：
      - projects/arm-test-flow/quality-report.md（Markdown格式）
      - 包含评分（百分制）、问题列表、修复建议
      - 对每个发现的问题标注严重级别（CRITICAL/HIGH/MEDIUM/LOW）
    input_file: projects/arm-test-flow/bookshop-cards.html
    output_file: projects/arm-test-flow/quality-report.md
    depends_on: [step-3]

  # ── Step 5: Forge 收尾 ──
  - id: step-5
    executor: forge
    fallback_agents: ["default"]
    title: 代码最终质检与润色
    description: |-
      对 step-2~step-4 的所有产出做最终处理：

      1. **代码润色**：
         - 读取 Laser 的 quality-report.md 中的问题
         - 修复所有 HIGH 及以上级别的问题
         - 如果 bookshop-cards.html 有可优化的地方（CSS命名、JS效率、HTML语义化），直接修复
      
      2. **最终输出**：
         - 修复后的 bookshop-cards.html → 覆盖源文件
         - 如果需要修改 generate_data.py → 覆盖源文件
         - 更新 quality-report.md 标注已修复项
      
      3. **完成确认**：
         - 确认 store-data.json 仍可通过 json.tool 验证
         - 输出最终的 DONE.md 包含：
           * 项目文件清单
           * 各步骤耗时汇总（预计）
           * 本次测试中各个大模型的表现评语（根据生成质量）
      
      **重要**：本步骤只修复问题，不改变功能逻辑。不改需求，不改数据。
    input_file: projects/arm-test-flow/quality-report.md
    output_file: projects/arm-test-flow/DONE.md
    depends_on: [step-4]
